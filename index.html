<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>대담 사진</title>
  <link rel="stylesheet" href="style.css?v=4">
  <script src="photos.js?v=4" defer></script>
  <script src="sound.js?v=4" defer></script>
  <script src="app.js?v=4" defer></script>
</head>
<body>
  <main>
    <h1 class="sr-only">대담 사진</h1>
    <div class="selector">
      <h2 class="sr-only">사진 선택</h2>
      <div id="topics" class="topics"></div>
      <button id="previous" class="arrow previous" aria-label="이전 사진" title="이전 사진"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 4-8 8 8 8"/></svg></button>
      <button id="next" class="arrow next" aria-label="다음 사진" title="다음 사진"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 4 8 8-8 8"/></svg></button>
    </div>
    <div id="stage" class="stage">
      <h2 id="scene-title" class="sr-only" tabindex="-1"></h2>
      <div id="photos" class="photos"></div>
    </div>
    <p id="status" class="sr-only" role="status"></p>
  </main>
  <dialog id="image-dialog" aria-labelledby="image-title">
    <h2 id="image-title" class="sr-only" tabindex="-1"></h2>
    <div id="image-scroll" class="image-scroll" tabindex="0" aria-label="확대한 사진"><img id="large-image" alt=""></div>
    <button id="close-image" class="close">닫기</button>
  </dialog>
  <noscript>사진을 보려면 JavaScript를 켜 주세요.</noscript>
</body>
</html>
